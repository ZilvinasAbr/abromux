[package]
name = "abromux-term"
version = "0.1.0"
edition = "2024"
description = "Terminals: PTYs, the app side of the server that keeps shells running, and remote terminals (POSIX); libghostty-vt is abromux-vt"
license = "MIT"
publish = false

[dependencies]
abromux-core = { path = "../abromux-core" }
abromux-server = { path = "../abromux-server", features = ["vt"] }
abromux-vt = { path = "../abromux-vt" }
anyhow = "1"
futures = { version = "0.3", features = ["executor"] }
libc = "0.2"
portable-pty = "0.9"
serde_json = { version = "1", features = ["preserve_order"] }
