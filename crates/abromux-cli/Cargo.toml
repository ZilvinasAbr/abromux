[package]
name = "abromux-cli"
version = "0.1.0"
edition = "2024"
description = "The abromux command line: shared by the app and abromux-server"
license = "MIT"

[dependencies]
abromux-core = { path = "../abromux-core" }
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
