[package]
name = "abromux-model"
version = "0.1.0"
edition = "2024"
description = "The workspace model without UI: workspaces, panes, tabs, status; events with a gapless seq, for the app, its server's replica and other clients (docs/server-plan.md, phase 2)"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
