[package]
name = "abromux-platform"
version = "0.1.0"
edition = "2024"
description = "Everything abromux asks of the operating system, behind one API"
license = "MIT"
publish = false

[dependencies]
abromux-core = { path = "../abromux-core" }
futures = "0.3"
raw-window-handle = "0.6"
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
block = "0.1"

# Only used on macOS (build.rs), but build scripts can't have per-target
# dependencies.
[build-dependencies]
cc = "1"
