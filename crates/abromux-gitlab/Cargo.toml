[package]
name = "abromux-gitlab"
version = "0.1.0"
edition = "2024"
description = "abromux plugin: review GitLab merge requests in a tab"
license = "MIT"
publish = false

[dependencies]
abromux-plugin = { path = "../abromux-plugin" }
gpui = { version = "=0.2.2", default-features = false, features = ["runtime_shaders"] }
gpui-component = "=0.5.1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Diffs of files GitLab leaves out of a big merge request's diff.
similar = "2"
# image previews' width and height (already a gpui dependency)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
