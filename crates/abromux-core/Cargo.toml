[package]
name = "abromux-core"
version = "0.1.0"
edition = "2024"
description = "abromux's logic that needs no UI and no OS calls"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# OSC 99 scan for ESC (already a dependency of several crates)
memchr = "2"
# OSC 7577 (program_resume): the MAC, argv elements and the token; all
# already in the build
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
