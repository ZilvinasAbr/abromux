<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="abromux">
<meta name="theme-color" content="#1f1e1d" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f1ea" media="(prefers-color-scheme: light)">
<meta name="format-detection" content="telephone=no">
<title>abromux</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="/vendor/xterm.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="app">

  <aside id="sidebar" aria-label="Workspaces">
    <div id="ws-list" class="sb-list"></div>
    <footer class="sb-foot">
      <button id="open-notes" class="foot-btn" aria-label="Notifications">
        <i class="ic" style="--ic:url(/icons/bell.svg)"></i><span>Notifications</span><b id="note-count" class="count" hidden></b>
      </button>
      <button id="new-ws" class="foot-btn icon-only" aria-label="New workspace">
        <i class="ic" style="--ic:url(/icons/plus.svg)"></i>
      </button>
    </footer>
  </aside>

  <div id="scrim"></div>

  <section id="main">
    <header id="nav">
      <button id="add-btn" class="nav-btn" aria-label="New tab" style="visibility:hidden">
        <i class="ic" style="--ic:url(/icons/plus.svg)"></i>
      </button>
      <div class="nav-title">
        <div id="title">abromux</div>
        <div id="subtitle"></div>
      </div>
      <button id="menu-btn" class="nav-btn" aria-label="Workspaces">
        <i class="ic" style="--ic:url(/icons/panel-left.svg)"></i><span id="menu-dot" class="menu-dot" hidden></span>
      </button>
    </header>
    <div id="offline" class="offline" hidden>Reconnecting to the Mac…</div>
    <nav id="tabs" class="tabs" hidden></nav>

    <div id="content">
      <div id="term-view" class="view" hidden>
        <div id="term-wrap">
          <div id="term"></div>
          <div id="term-note" hidden></div>
          <div class="zoom">
            <button id="zoom-out" aria-label="Smaller text">A</button>
            <button id="zoom-in" aria-label="Larger text">A</button>
          </div>
        </div>
        <div id="keys" class="keys">
          <button data-key="escape">esc</button>
          <button data-key="tab">tab</button>
          <button data-key="ctrl-c">⌃C</button>
          <button data-key="shift-tab">⇧tab</button>
          <button data-key="up" class="arrow">↑</button>
          <button data-key="down" class="arrow">↓</button>
          <button data-key="left" class="arrow">←</button>
          <button data-key="right" class="arrow">→</button>
          <button data-key="enter">return</button>
          <button data-key="backspace">⌫</button>
          <button data-key="ctrl-d">⌃D</button>
          <button data-key="ctrl-r">⌃R</button>
          <button data-key="ctrl-l">⌃L</button>
          <button data-key="ctrl-z">⌃Z</button>
        </div>
        <form id="composer" class="composer">
          <textarea id="input" rows="1" placeholder="Message" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="send"></textarea>
          <button id="send" type="submit" aria-label="Send">
            <svg viewBox="0 0 16 16"><path d="M8 13V3.5M3.75 7.5 8 3.25l4.25 4.25" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </form>
      </div>

      <iframe id="chat-frame" class="view" title="Claude" hidden></iframe>

      <div id="placeholder" class="view placeholder" hidden>
        <i id="ph-icon" class="ic big"></i>
        <h2 id="ph-title"></h2>
        <p id="ph-text"></p>
        <button id="ph-action" class="pill-btn" hidden></button>
      </div>

      <div id="edge" aria-hidden="true"></div>
    </div>
  </section>

  <div id="sheet" class="sheet-root" hidden>
    <div class="sheet-scrim"></div>
    <div class="sheet" role="dialog">
      <div class="grabber"></div>
      <div id="sheet-body"></div>
    </div>
  </div>

  <div id="toast" hidden></div>
</div>
<script src="/vendor/xterm.js"></script>
<script src="/app.js"></script>
</body>
</html>
