<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude</title>
<link rel="stylesheet" href="/__chat/page.css">
</head>
<body>
<div id="app">
  <main id="scroll">
    <div id="empty" class="empty">
      <span class="spark big"></span>
      <h1 id="greeting">What should we work on?</h1>
      <p class="empty-cwd" id="empty-cwd"></p>
    </div>
    <div id="thread" class="thread"></div>
    <div id="working" class="working" hidden>
      <span class="spark spin"></span><span id="working-text">Working…</span><span class="hint">esc to interrupt</span>
    </div>
    <div class="scroll-pad"></div>
  </main>
  <button id="to-bottom" class="to-bottom" hidden aria-label="Scroll to bottom">
    <svg viewBox="0 0 16 16"><path d="M8 3v10M3.5 8.5 8 13l4.5-4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <footer class="composer-wrap">
    <div id="slash" class="popover slash" hidden></div>
    <div class="composer" id="composer">
      <div id="attachments" class="attachments" hidden></div>
      <div class="composer-row">
        <textarea id="input" rows="1" placeholder="Type / for commands" spellcheck="true" autofocus></textarea>
        <button id="send" class="send" title="Send (↩)" disabled>
          <svg class="i-send" viewBox="0 0 16 16"><path d="M8 13V3.5M3.75 7.5 8 3.25l4.25 4.25" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <svg class="i-stop" viewBox="0 0 16 16"><rect x="4.5" y="4.5" width="7" height="7" rx="1.25" fill="currentColor"/></svg>
        </button>
      </div>
    </div>
    <div class="composer-bar">
      <div class="bar-right">
        <span id="ctx" class="ctx" hidden></span>
        <button id="model" class="chip" title="Model and effort"></button>
        <button id="mode" class="chip" title="Permission mode (⇧Tab)"></button>
        <button id="history" class="chip icon" title="Past conversations in this folder">
          <svg viewBox="0 0 16 16"><path d="M2.75 8a5.25 5.25 0 1 0 1.6-3.78M2.5 2.75v2.5H5" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 5.25V8l1.9 1.4" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="new" class="chip icon" title="New conversation">
          <svg viewBox="0 0 16 16"><path d="M13 8.5V12a1.5 1.5 0 0 1-1.5 1.5h-7A1.5 1.5 0 0 1 3 12V4.5A1.5 1.5 0 0 1 4.5 3H8M11.5 2.5l2 2L8 10H6V8z" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
    <div id="menu" class="popover menu" hidden></div>
  </footer>
</div>
<script src="/__chat/hl.js"></script>
<script src="/__chat/page.js"></script>
</body>
</html>
