[package]
name = "abromux"
version = "0.30.0"
edition = "2024"
description = "A cmux-style terminal and browser workspace app for macOS, built with Rust, GPUI and libghostty-vt"
license = "MIT"
repository = "https://github.com/ZilvinasAbr/abromux"
readme = "README.md"
publish = false

[workspace]
members = ["crates/*"]

[features]
default = ["gitlab"]
# Plugins (crates/): each adds a kind of tab, see src/plugins.rs
gitlab = ["dep:abromux-gitlab"]

[dependencies]
abromux-plugin = { path = "crates/abromux-plugin" }
abromux-core = { path = "crates/abromux-core" }
abromux-term = { path = "crates/abromux-term" }
abromux-platform = { path = "crates/abromux-platform" }
abromux-browser = { path = "crates/abromux-browser" }
abromux-gitlab = { path = "crates/abromux-gitlab", optional = true }
gpui = { version = "=0.2.2", default-features = false, features = ["runtime_shaders"] }
gpui-component = { version = "=0.5.1", features = ["webview"] }
portable-pty = "0.9"
anyhow = "1"
futures = { version = "0.3", features = ["executor"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: the Settings window rewrites config.json keeping the user's key order
serde_json = { version = "1", features = ["preserve_order"] }
libc = "0.2"
# Kitty graphics PNG decoding (already a gpui dependency)
image = "0.25"
# Markdown tabs (src/markdown.rs); already a gpui-component dependency
markdown = "=1.0.0"


[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 2
