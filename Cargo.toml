[package]
name = "abromux"
version = "0.13.1"
edition = "2024"
description = "A cmux-style terminal and browser workspace app for macOS, built with Rust, GPUI and libghostty-vt"
license = "MIT"
repository = "https://github.com/ZilvinasAbr/abromux"
readme = "README.md"
publish = false

[dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["runtime_shaders"] }
gpui-component = { version = "=0.5.1", features = ["webview"] }
# WebKit inspector in release builds (⌥⌘I); same crate gpui-component uses
lb-wry = { version = "=0.53.3", features = ["devtools"] }
portable-pty = "0.9"
anyhow = "1"
futures = { version = "0.3", features = ["executor"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: the Settings window rewrites config.json keeping the user's key order
serde_json = { version = "1", features = ["preserve_order"] }
# inline terminal cell text (already a gpui dependency)
smol_str = "0.2"
# OSC 99 scan for ESC (already a dependency of several crates)
memchr = "2"
# debug window snapshots (ABROMUX_SNAPSHOT)
objc = "0.2"
libc = "0.2"
# page click monitor (browser.rs)
block = "0.1"
raw-window-handle = "0.6"
# Kitty graphics PNG decoding (already a gpui dependency)
image = "0.25"

[build-dependencies]
bindgen = "0.71"
# the native WebAuthn bridge (src/webauthn.m)
cc = "1"

[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 2
