<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="960" height="470" rx="18" fill="#1b1a18"/>
  <rect x="0.5" y="0.5" width="959" height="469" rx="17.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <text x="40" y="52" font-size="20" font-weight="700" fill="#f1ece4">abromux vs cmux</text>
  <text x="40" y="76" font-size="13" fill="#8f8a80">Apple M1 Pro · macOS 27.0.1 · scripts/bench.sh</text>

  <g font-size="12.5" fill="#cfc9bf">
    <rect x="652" y="40" width="12" height="12" rx="3" fill="#d97757"/><text x="672" y="51">abromux</text>
    <rect x="752" y="40" width="12" height="12" rx="3" fill="#5a554e"/><text x="772" y="51">cmux 0.64.25</text>
  </g>

  <!-- bars start at x=300, full width 520 px = the larger value of the row -->
  <g font-size="13.5">
    <!-- row 1 -->
    <text x="40" y="128" font-weight="600" fill="#e8e3da">Launch to ready</text>
    <text x="40" y="146" font-size="12" fill="#7f7a71">control socket answers · lower is better</text>
    <rect x="300" y="114" width="219" height="16" rx="4" fill="#d97757"/>
    <text x="529" y="127" font-size="12.5" font-weight="700" fill="#f1ece4">240 ms</text>
    <rect x="300" y="136" width="520" height="16" rx="4" fill="#5a554e"/>
    <text x="830" y="149" font-size="12.5" fill="#a59f95">570 ms</text>

    <!-- row 2 -->
    <text x="40" y="200" font-weight="600" fill="#e8e3da">Memory, idle</text>
    <text x="40" y="218" font-size="12" fill="#7f7a71">one terminal · lower is better</text>
    <rect x="300" y="186" width="186" height="16" rx="4" fill="#d97757"/>
    <text x="496" y="199" font-size="12.5" font-weight="700" fill="#f1ece4">72 MB</text>
    <rect x="300" y="208" width="520" height="16" rx="4" fill="#5a554e"/>
    <text x="830" y="221" font-size="12.5" fill="#a59f95">201 MB</text>

    <!-- row 3 -->
    <text x="40" y="272" font-weight="600" fill="#e8e3da">Memory per terminal</text>
    <text x="40" y="290" font-size="12" fill="#7f7a71">each extra workspace · lower is better</text>
    <rect x="300" y="258" width="52" height="16" rx="4" fill="#d97757"/>
    <text x="362" y="271" font-size="12.5" font-weight="700" fill="#f1ece4">0.4 MB</text>
    <rect x="300" y="280" width="520" height="16" rx="4" fill="#5a554e"/>
    <text x="830" y="293" font-size="12.5" fill="#a59f95">4.0 MB</text>

    <!-- row 4 -->
    <text x="40" y="344" font-weight="600" fill="#e8e3da">CPU while idle</text>
    <text x="40" y="362" font-size="12" fill="#7f7a71">11 terminals, 30 s · lower is better</text>
    <rect x="300" y="330" width="4" height="16" rx="2" fill="#d97757"/>
    <text x="314" y="343" font-size="12.5" font-weight="700" fill="#f1ece4">0.0 %</text>
    <rect x="300" y="352" width="520" height="16" rx="4" fill="#5a554e"/>
    <text x="830" y="365" font-size="12.5" fill="#a59f95">1.7 %</text>

    <!-- row 5 -->
    <text x="40" y="416" font-weight="600" fill="#e8e3da">Colored output</text>
    <text x="40" y="434" font-size="12" fill="#7f7a71">truecolor SGR on every word · higher is better</text>
    <rect x="300" y="402" width="520" height="16" rx="4" fill="#d97757"/>
    <text x="830" y="415" font-size="12.5" font-weight="700" fill="#f1ece4">113 MB/s</text>
    <rect x="300" y="424" width="248" height="16" rx="4" fill="#5a554e"/>
    <text x="558" y="437" font-size="12.5" fill="#a59f95">54 MB/s</text>
  </g>
</svg>
